<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Attendance Dashboard</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<nav>
<h2>Student Attendance Tracker</h2>
<div>
<a href="{{ url_for('index') }}">Dashboard</a>
<a href="{{ url_for('students') }}">Students</a>
<a href="{{ url_for('attendance') }}">Attendance</a>
<a href="{{ url_for('reports') }}">Reports</a>
</div>
</nav>
<div class="container">
<h1>Attendance Dashboard</h1>
<div class="cards">
<div class="card"><h3>Total Students</h3><p>{{ total_students }}</p></div>
<div class="card"><h3>Attendance Days</h3><p>{{ total_classes }}</p></div>
<div class="card"><h3>Overall Attendance</h3><p>{{ overall_percentage }}%</p></div>
</div>
<div class="dashboard-info">
<h2>Quick Actions</h2>
<div class="buttons">
<a class="button" href="{{ url_for('students') }}">Add Students</a>
<a class="button" href="{{ url_for('attendance') }}">Record Attendance</a>
<a class="button" href="{{ url_for('reports') }}">View Reports</a>
</div>
</div>
</div>
</body>
</html>
